name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile CLI
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./cmd/devops-daily
          done
      - name: Cross-compile SSH server
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/ssh-site

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Test npm assembler
        run: node --test npm/scripts/assemble.test.mjs
      - name: Assemble npm packages
        run: |
          version=$(find dist -maxdepth 1 -type f -name 'devops-daily_*_linux_amd64.tar.gz' -printf '%f\n' | sed -n 's/^devops-daily_\(.*\)_linux_amd64\.tar\.gz$/\1/p')
          test -n "$version"
          node npm/scripts/assemble.mjs --version "$version" --dist dist --out npm/dist
      - name: Smoke-test Linux shim
        run: NODE_PATH="$PWD/npm/dist" node npm/dist/@devopsdaily/devops-daily-cli/bin/devops-daily.js version

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts
        run: shellcheck install.sh scripts/completions.sh
