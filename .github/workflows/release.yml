name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm
        required: true
        type: string

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  npm:
    needs: release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm token
        id: npm-token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download release assets
        if: steps.npm-token.outputs.publish == 'true'
        run: gh release download "$RELEASE_TAG" --repo The-DevOps-Daily/devops-daily-cli --dir release-dist
      - name: Verify checksums
        if: steps.npm-token.outputs.publish == 'true'
        run: (cd release-dist && sha256sum -c checksums.txt)
      - name: Assemble npm packages
        if: steps.npm-token.outputs.publish == 'true'
        run: node npm/scripts/assemble.mjs --version "${RELEASE_TAG#v}" --dist release-dist --out npm/dist
      - name: Publish platform packages
        if: steps.npm-token.outputs.publish == 'true'
        run: |
          for package in npm/dist/@devopsdaily/devops-daily-cli-*; do
            (cd "$package" && npm publish --provenance --access public)
          done
      - name: Publish main package
        if: steps.npm-token.outputs.publish == 'true'
        run: (cd npm/dist/@devopsdaily/devops-daily-cli && npm publish --provenance --access public)
